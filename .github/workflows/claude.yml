# 在 issue / PR 里 @claude，它就来干活。
# 这是「手机应急」的核心：你在手机上打一句话，云端虚拟机启动、读代码、改代码、开 PR。
#
# 当前配置：胶水层用 Anthropic 的 Action，大脑用 DeepSeek（走 Anthropic 兼容端点）。
# 想换回原生 Claude 或换成 Kimi，见 docs/providers.md。
name: Claude

on:
  issue_comment:                    # issue 和 PR 的普通评论
    types: [created]
  pull_request_review_comment:      # PR 里针对某一行代码的评论
    types: [created]
  pull_request_review:              # 提交 review 时带的总评
    types: [submitted]
  issues:                           # 新建 issue，或给 issue 打标签
    types: [opened, assigned, labeled]

jobs:
  claude:
    # 只有真的出现 @claude 才启动，避免每条评论都烧一次钱
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))

    runs-on: ubuntu-latest
    permissions:
      contents: write         # 建分支、提交代码
      pull-requests: write    # 开 PR、写评论
      issues: write           # 回复 issue
      id-token: write         # OIDC 鉴权
      actions: read           # 让它能读 CI 日志，知道自己改挂了没

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0      # 完整历史，便于 git log/blame 定位问题是哪次引入的

      - uses: anthropics/claude-code-action@v1
        env:
          # ── 大脑：DeepSeek 的 Anthropic 兼容端点 ──────────────────
          ANTHROPIC_BASE_URL: https://api.deepseek.com/anthropic
          # DeepSeek 会把 Claude 的型号名自动映射到自家模型，但显式指定更稳
          ANTHROPIC_MODEL: deepseek-v4-pro
          ANTHROPIC_DEFAULT_OPUS_MODEL: deepseek-v4-pro
          ANTHROPIC_DEFAULT_SONNET_MODEL: deepseek-v4-pro
          ANTHROPIC_DEFAULT_HAIKU_MODEL: deepseek-v4-flash
          CLAUDE_CODE_SUBAGENT_MODEL: deepseek-v4-flash
          # ─────────────────────────────────────────────────────
        with:
          # 密钥必须走 anthropic_api_key 这个「输入项」，不能只塞 ANTHROPIC_AUTH_TOKEN 环境变量：
          # Action 启动前有一道预检，只认 ANTHROPIC_API_KEY / CLAUDE_CODE_OAUTH_TOKEN / WIF 三者之一。
          # DeepSeek 的兼容端点明确支持 x-api-key 头，所以这样传是通的。
          anthropic_api_key: ${{ secrets.DEEPSEEK_API_KEY }}
          claude_args: |
            --max-turns 25

# ── 换回原生 Claude 订阅（能力最强，不额外花钱）──────────────
