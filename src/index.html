<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>小卖部 · 结算台</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #fff; --fg: #16181d; --muted: #6b7280;
    --line: #e5e7eb; --accent: #2563eb; --danger: #dc2626; --ok: #059669;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0f1115; --card:#171a21; --fg:#e8eaed; --muted:#9aa1ad;
            --line:#262b36; --accent:#60a5fa; --danger:#f87171; --ok:#34d399; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 16px/1.6 system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
  }
  .wrap { max-width: 480px; margin: 0 auto; padding: 20px 16px 48px; }
  h1 { font-size: 20px; margin: 8px 0 4px; }
  .ver { color: var(--muted); font-size: 13px; margin-bottom: 20px; }
  .card { background: var(--card); border: 1px solid var(--line);
          border-radius: 14px; padding: 16px; margin-bottom: 14px; }
  .row { display: flex; align-items: center; gap: 12px; padding: 10px 0; }
  .row + .row { border-top: 1px solid var(--line); }
  .row .name { flex: 1; }
  .row .price { color: var(--muted); font-size: 14px; }
  .qty { display: flex; align-items: center; gap: 4px; }
  .qty button {
    width: 34px; height: 34px; border-radius: 9px; border: 1px solid var(--line);
    background: transparent; color: var(--fg); font-size: 18px; cursor: pointer;
  }
  .qty span { min-width: 26px; text-align: center; font-variant-numeric: tabular-nums; }
  label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
  select {
    width: 100%; padding: 12px; font-size: 16px; border-radius: 10px;
    border: 1px solid var(--line); background: var(--card); color: var(--fg);
  }
  .line { display: flex; justify-content: space-between; padding: 7px 0; font-size: 15px; }
  .line span:first-child { color: var(--muted); }
  .line b { font-variant-numeric: tabular-nums; font-weight: 500; }
  .total { border-top: 1px solid var(--line); margin-top: 8px; padding-top: 14px;
           font-size: 19px; }
  .total b { font-weight: 700; font-size: 24px; }
  .bad { color: var(--danger); }
  .alert { display: none; background: color-mix(in srgb, var(--danger) 12%, transparent);
           border: 1px solid var(--danger); color: var(--danger);
           border-radius: 10px; padding: 12px; font-size: 14px; margin-top: 12px; }
  .alert.show { display: block; }
  footer { color: var(--muted); font-size: 12px; text-align: center; margin-top: 24px; }
  code { background: var(--bg); padding: 1px 5px; border-radius: 4px; font-size: 12px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>🏪 小卖部 · 结算台</h1>
  <div class="ver">线上环境 · 版本 <code id="build">dev</code></div>

  <div class="card" id="cart"></div>

  <div class="card">
    <label for="coupon">优惠券</label>
    <select id="coupon">
      <option value="">不使用优惠券</option>
      <option value="SAVE20">SAVE20 · 满100减20</option>
      <option value="HALFOFF">HALFOFF · 全场五折</option>
    </select>
  </div>

  <div class="card">
    <div class="line"><span>商品小计</span><b id="subtotal">–</b></div>
    <div class="line"><span>优惠</span><b id="discount">–</b></div>
    <div class="line"><span>运费</span><b id="shipping">–</b></div>
    <div class="line total"><span>应付</span><b id="total">–</b></div>
    <div class="alert" id="alert"></div>
  </div>

  <footer>每次合并到 main 会自动重新部署这个页面</footer>
</div>
<script type="module" src="./app.js"></script>
</body>
</html>
